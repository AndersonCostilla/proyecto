name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-pwsh
            os: ubuntu-latest
            shell: pwsh
          - label: windows-pwsh
            os: windows-latest
            shell: pwsh
          - label: windows-ps51
            os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Nota: steps.shell no admite el contexto matrix, por eso las piernas se
      # separan con if y shell literal. La suite se lanza como proceso hijo con
      # -File: GitHub Actions ejecuta los bloques con `-command ". script"`, y la
      # suite necesita la entrada canonica -File para que los overrides $global:
      # de los tests (limites de Excel, mocks de Ollama) resuelvan igual que en
      # local. Tee-Object guarda la salida en tests/_last-run.log (gitignored)
      # sin modificar el runner. El primer reinicio de $ErrorActionPreference
      # deshace el 'stop' que GitHub prepende: en Windows PowerShell 5.1 el
      # stderr nativo del hijo elevaria ErrorRecords terminantes y abortaria el
      # paso a mitad de suite; el exit real lo gobierna $LASTEXITCODE.
      - name: Suite completa (109 tests, pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host ("pwsh {0} ({1})" -f $PSVersionTable.PSVersion, $PSVersionTable.OS)
          $exe = 'pwsh'
          & $exe -NoProfile -ExecutionPolicy Bypass -File ./tests/run-tests.ps1 2>&1 3>&1 4>&1 6>&1 | Tee-Object -FilePath tests/_last-run.log
          if ((Test-Path -LiteralPath variable:\LASTEXITCODE) -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Suite completa (109 tests, Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host ("Windows PowerShell {0} ({1})" -f $PSVersionTable.PSVersion, $PSVersionTable.OS)
          $exe = 'powershell'
          & $exe -NoProfile -ExecutionPolicy Bypass -File ./tests/run-tests.ps1 2>&1 3>&1 4>&1 6>&1 | Tee-Object -FilePath tests/_last-run.log
          if ((Test-Path -LiteralPath variable:\LASTEXITCODE) -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Soak corto de estabilidad (5 iteraciones del pipeline completo).
      # Solo en la pierna linux/pwsh para mantener el CI rapido y gratis.
      - name: Soak (5 iteraciones)
        if: matrix.label == 'linux-pwsh'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & pwsh -NoProfile -ExecutionPolicy Bypass -File ./tests/soak/run-soak.ps1 -Iterations 5 2>&1 3>&1 4>&1 6>&1 | Tee-Object -FilePath tests/_soak-run.log
          if ((Test-Path -LiteralPath variable:\LASTEXITCODE) -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir logs (solo si fallo)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.label }}
          path: |
            tests/_last-run.log
            tests/_soak-run.log
          if-no-files-found: ignore
          retention-days: 7

      # El resumen queda en la pagina del check (visible via API publica de
      # check-runs), sin necesidad de autenticacion para leer los logs.
      - name: Resumen del fallo (check publico)
        if: failure()
        shell: pwsh
        run: |
          $fence = '```'
          $body = ''
          if (Test-Path -LiteralPath 'tests/_last-run.log') {
            $lines = @(Get-Content -LiteralPath 'tests/_last-run.log')
            $tail = if ($lines.Count -gt 60) { $lines[($lines.Count - 60)..($lines.Count - 1)] } else { $lines }
            $body = ($tail -join "`n")
          }
          else {
            $body = '(sin tests/_last-run.log)'
          }
          $md = '### Suite fallida (' + '${{ matrix.label }}' + ')' + "`n" + $fence + "`n" + $body + "`n" + $fence + "`n"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $md
