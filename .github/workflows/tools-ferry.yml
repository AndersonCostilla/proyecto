name: tools-ferry

# HERRAMIENTA TEMPORAL DE RECUPERACION DE ENTORNO (se elimina al cerrar el PR).
#
# Contexto: el sandbox donde se desarrolla PWX solo permite conexiones a
# github.com / api.github.com, por lo que no puede descargar el toolchain de
# PowerShell desde otros dominios (packages.microsoft.com, release-assets,
# etc.). Este workflow descarga el tarball oficial de PowerShell en el runner
# de Actions (que si tiene red completa) y lo publica en una rama temporal
# `tools/ferry` para recuperarlo despues con un simple `git fetch` (que si
# funciona). No toca `main` ni la suite de tests.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tools-ferry.yml'

permissions:
  contents: write

concurrency:
  group: tools-ferry
  cancel-in-progress: true

jobs:
  ferry:
    name: Publicar tarball pwsh linux-x64 en tools/ferry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar PowerShell 7.4.6 (linux-x64) y checksum
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o pwsh-linux-x64.tar.gz \
            'https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell-7.4.6-linux-x64.tar.gz'
          sha256sum pwsh-linux-x64.tar.gz > pwsh-linux-x64.tar.gz.sha256
          ls -la pwsh-linux-x64.tar.gz*

      - name: Publicar rama temporal tools/ferry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf ferry-repo
          git init -q ferry-repo
          cd ferry-repo
          git config user.name 'pwx-tools-ferry'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp ../pwsh-linux-x64.tar.gz ../pwsh-linux-x64.tar.gz.sha256 .
          git add pwsh-linux-x64.tar.gz pwsh-linux-x64.tar.gz.sha256
          git commit -qm 'tools: pwsh 7.4.6 linux-x64 (recuperacion de entorno, temporal)'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q origin HEAD:refs/heads/tools/ferry --force
          echo 'Publicado en refs/heads/tools/ferry'
